<!-- We will be using this page for our LAMP project -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merc Mann | Contacts</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navigation -->
    <header class="main-header">

        <div class="header-brand">
            <h1>MERC MANN</h1>
            <p>Mercenary Contact Management</p>
        </div>

        <div class="user-menu">
            <span id="welcomeUser">Welcome</span>
            <button id="logoutButton" type="button">
                Log Out
            </button>
        </div>

    </header>


    <!-- Main Content -->
    <main class="dashboard-container">

        <div class="dashboard-header">

            <div>
                <h2>My Mercenaries</h2>
                <p>Manage your mercenary contacts.</p>
            </div>

            <button
                id="addContactButton"
                class="primary-button"
                type="button"
            >
                + Add Contact
            </button>

        </div>


        <!-- Search and Filter -->
        <div class="contact-tools">

            <div class="search-container">
                <label for="search">Search Contacts</label>

                <input
                    type="text"
                    id="search"
                    placeholder="Search by name"
                >
            </div>


            <div class="filter-container">
                <label for="classFilter">Class</label>

                <select id="classFilter">

                    <option value="">All Classes</option>
                    <option value="Scout">Scout</option>
                    <option value="Soldier">Soldier</option>
                    <option value="Pyro">Pyro</option>
                    <option value="Demoman">Demoman</option>
                    <option value="Heavy">Heavy</option>
                    <option value="Engineer">Engineer</option>
                    <option value="Medic">Medic</option>
                    <option value="Sniper">Sniper</option>
                    <option value="Spy">Spy</option>

                </select>
            </div>

        </div>


        <!-- Contact List -->
        <section class="contacts-section">

            <div id="contactList">

                <!--
                    contacts.js will eventually create
                    contact cards here.
                -->

                <div id="emptyMessage" class="empty-message">

                    <h3>No mercenaries yet.</h3>

                    <p>
                        Add your first contact to get started.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Add Contact Modal -->
    <div id="contactModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Add Mercenary</h2>

                <button
                    id="closeModalButton"
                    type="button"
                    aria-label="Close"
                >
                    &times;
                </button>

            </div>


            <form id="contactForm">

                <div class="form-group">

                    <label for="contactName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="contactName"
                        placeholder="Enter contact name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contactClass">
                        Class
                    </label>

                    <select id="contactClass" required>

                        <option value="">
                            Select a class
                        </option>

                        <option value="Scout">Scout</option>
                        <option value="Soldier">Soldier</option>
                        <option value="Pyro">Pyro</option>
                        <option value="Demoman">Demoman</option>
                        <option value="Heavy">Heavy</option>
                        <option value="Engineer">Engineer</option>
                        <option value="Medic">Medic</option>
                        <option value="Sniper">Sniper</option>
                        <option value="Spy">Spy</option>

                    </select>

                </div>


                <p id="contactError" class="error-message"></p>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Add Contact
                </button>

            </form>

        </div>

    </div>


    <script src="js/config.js"></script>
    <script src="js/contacts.js"></script>

</body>

</html>
